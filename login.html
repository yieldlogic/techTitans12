<html>
<head>
    <title>Tech Titans</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">
    <header>
        <div class="header-container">
        <h1>YieldLogic</h1>
            <nav>
                    <div><a href="crops.html"><i class="fas fa-house"></i>Home</a></div>
                    <div><a href="about.html"><i class="fas fa-info-circle"></i>About Us</a></div>
            </nav>
        </div>
    </header>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fas fa-seedling"></i>
                </div>
                <h2>Welcome</h2>
                <p>Sign in to access your dashboard</p>
            </div>

            <div class="error-message" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorTxt">Invalid email or password</span>
            </div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope" style="margin-right: 8px;"></i>Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock" style="margin-right: 8px;"></i>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" checked> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <a href="crops.html">
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt" style="margin-right: 10px;"></i>Login
                </button>
                </a>
            </form>

            <div class="register-link">
                Don't have an account? <a href="signup.html">Create one</a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Tech Titans. All rights reserved.
    </footer>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const errorTxt = document.getElementById('errorTxt');

            if (!email || !password) {
                errorTxt.textContent = 'Please fill in all fields';
                errorMsg.classList.add('show');
                return false;
            }

            if (!email.includes('@') || !email.includes('.')) {
                errorTxt.textContent = 'Please enter a valid email address';
                errorMsg.classList.add('show');
                return false;
            }

            if (password.length < 8) {
                errorTxt.textContent = 'Password must have at least 8 characters';
                errorMsg.classList.add('show');
                return false;
            }

            errorMsg.classList.remove('show');

            alert('Login successful! Redirecting to dashboard...');
            window.location.href = 'crops.html';
            return true;
        }

        document.getElementById('email').addEventListener('input', function() {
            document.getElementById('errorMsg').classList.remove('show');
        })

        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('errorMsg').classList.remove('show');
        })

        const passwordInput = document.getElementById('password');
        const togglePassword = document.createElement('i');
        togglePassword.className = 'fas fa-eye';
        togglePassword.style.cssText = `
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            font-size: 18px;
        `;
        passwordInput.parentElement.appendChild(togglePassword);

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password'
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash')
        });
    </script>

</body>
</html>
